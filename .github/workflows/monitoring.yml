name: Monitoring integration check

# Server-side mirror of .githooks/pre-commit and pre-push, which only
# protect a clone that's run `composer install` at least once. This makes
# it unconditional — can't be skipped with --no-verify or bypassed by a
# push from a clone that never installed the hooks.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php artisan migrate --force

      - name: Verify Xquisite monitoring integration
        run: php artisan monitoring:verify
